<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETMLShoot — FPS multijoueur</title>
<meta name="description" content="ETMLShoot : FPS multijoueur 3D dans le navigateur. Mêlée générale, match à mort par équipes et survie coopérative.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23121416'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffb238' stroke-width='2.5'/%3E%3Cpath d='M16 3v8M16 21v8M3 16h8M21 16h8' stroke='%23ffb238' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<!-- Affichage tête haute -->
<div id="hud" class="hidden">
  <canvas id="dmgdir"></canvas>
  <div id="lowhp"></div>
  <div id="bloodscreen"></div>

  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
  <div id="scope"><div class="lens"></div></div>

  <div id="topbar"></div>
  <div id="killfeed"></div>
  <div id="netinfo"></div>
  <canvas id="minimap" width="176" height="176"></canvas>

  <div id="announce"></div>
  <div id="subannounce"></div>
  <div id="prompt"></div>
  <div id="pickupmsg"></div>

  <div id="vitals">
    <div class="row"><span class="ico">✚</span><div class="bar hp"><b id="hpbar"></b></div><span id="hpnum" class="num">100</span></div>
    <div class="row"><span class="ico">⛨</span><div class="bar ar"><b id="arbar"></b></div><span id="arnum" class="num">0</span></div>
    <div id="money"></div>
  </div>

  <div id="weapon">
    <div id="slots"></div>
    <div class="ammo"><span id="ammo">30</span><span class="sep">/</span><span id="reserve">120</span></div>
    <div id="wname">FA-7 MISTRAL</div>
    <div id="nades"></div>
    <div id="reloadbar"><b></b></div>
  </div>

  <div id="chat"><div id="chatlog"></div><input id="chatinput" maxlength="140" autocomplete="off" spellcheck="false" placeholder="Message… (Entrée pour envoyer)"></div>
  <div id="scoreboard" class="hidden"></div>
  <div id="deathscreen" class="hidden"></div>
  <div id="endscreen" class="hidden"></div>
</div>

<!-- Menus -->
<div id="overlay"></div>
<div id="loading" class="hidden"><div class="box"><div class="title">ETMLShoot</div><div id="loadtext">Chargement…</div><div class="track"><b id="loadbar"></b></div></div></div>
<div id="toast"></div>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#111;font:18px sans-serif">ETMLShoot nécessite JavaScript et WebGL 2.</div></noscript>

<script type="module" src="/js/main.js"></script>
</body>
</html>
